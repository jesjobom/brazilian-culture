<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ça, c’est bien brésilien ! · Culture brésilienne</title>
    <link rel="stylesheet" href="vendor/reveal/dist/reset.css" />
    <link rel="stylesheet" href="vendor/reveal/dist/reveal.css" />
    <link rel="stylesheet" href="vendor/reveal/dist/theme/night.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="presentation-page">
    <div class="remote-overlay is-collapsed" id="remote-overlay" lang="pt-BR">
      <button class="remote-toggle" id="remote-toggle" type="button" aria-expanded="false" aria-controls="remote-card" aria-label="Abrir painel do controle remoto">🎛️</button>
      <div class="remote-card" id="remote-card">
        <div class="remote-card-header">
          <div>
            <p class="eyebrow">Controle remoto</p>
            <h2>Escaneie para controlar os slides</h2>
          </div>
          <button class="remote-close" id="remote-close" type="button" aria-label="Fechar painel do controle remoto">✕</button>
        </div>
        <label class="connection-mode-label" for="connection-mode">Conexão do controle</label>
        <select id="connection-mode" class="connection-mode-select">
          <option value="auto">Automático (direto → TURN)</option>
          <option value="direct">Direto (sem TURN)</option>
          <option value="relay">Somente TURN (TLS/443)</option>
        </select>
        <div class="qr-shell"><div id="remote-qr" aria-label="QR code do controle remoto"></div></div>
        <p class="session-line">Sessão: <code id="session-id">...</code></p>
        <p class="link-line"><a id="remote-link" href="#" target="_blank" rel="noopener noreferrer">Abrir controle remoto</a></p>
        <p class="status-line">Status: <span id="remote-status" role="status">Inicializando...</span></p>
      </div>
    </div>

    <div class="toast" id="remote-toast" aria-live="polite" lang="pt-BR"></div>

    <div class="reveal">
      <div class="slides">
        <section class="cover-slide" aria-labelledby="cover-title">
          <div class="cover-copy">
            <p class="cover-eyebrow">Au quotidien</p>
            <h1 class="cover-title" id="cover-title">Ça, c’est bien<br /><span>brésilien !</span></h1>
            <p class="cover-subtitle">Ces petites choses qui font le Brésil.</p>
          </div>
          <img
            class="cover-art"
            src="assets/brazil-fingerprint.png"
            alt="Une empreinte digitale aux couleurs du drapeau brésilien."
            width="1024"
            height="1621"
          />
        </section>
        <section class="placeholder-slide">
          <h2>Petites habitudes du quotidien</h2>
          <p>Diapositive provisoire pour tester la navigation.</p>
        </section>
      </div>
    </div>

    <script src="vendor/reveal/dist/reveal.js"></script>
    <script src="vendor/qrious.min.js"></script>
    <script src="vendor/peerjs.min.js"></script>
    <script src="app.js?v=20261021-metered-turn"></script>
  </body>
</html>
